name: Phone app (test version)

# Builds the phone apps from an "app-test-<date>" branch into the release "test-<date>".
# Later web updates happen on main and don't touch it: each test version keeps its own branch and release.
on:
  push:
    branches: ['app-test-*']


permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME#app-}"
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Niniko's Map phone app ($TAG)" \
            --notes "A fixed test version of Niniko's Map. Android: download niniko-map.apk on the phone and open it. iPhone: install niniko-map.ipa with Sideloadly or AltStore. Built from ${GITHUB_SHA::7}."

  android:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build APK
        # GitHub's Ubuntu runners already have the Android SDK (ANDROID_HOME).
        run: native/build-android.sh
      - name: Add to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME#app-}" native/niniko-map.apk --clobber -R "$GITHUB_REPOSITORY"

  ios:
    needs: release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build IPA (unsigned)
        run: native/build-ios.sh
      - name: Add to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME#app-}" native/niniko-map.ipa --clobber -R "$GITHUB_REPOSITORY"
