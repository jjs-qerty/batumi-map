name: Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build APK
        # GitHub's Ubuntu runners already have the Android SDK (ANDROID_HOME).
        run: native/build-android.sh
      - name: Publish to the "android" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android --yes --cleanup-tag || true
          gh release create android native/niniko-map.apk \
            --title "Niniko's Map for Android" \
            --notes "Download niniko-map.apk on your Android phone and open it to install. Built from ${GITHUB_SHA::7}." \
            --latest
